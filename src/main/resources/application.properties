spring.application.name=SIS
spring.datasource.url=jdbc:postgresql://localhost:5432/universitydb
spring.datasource.username=postgres
spring.datasource.password=3108
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cache Configuration
# Redis caching now works correctly with DTOs only (not JPA entities)
# Entity-level caching has been removed from services to prevent serialization issues
spring.cache.type=redis

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=600000